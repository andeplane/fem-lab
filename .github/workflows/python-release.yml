name: Python distribution
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish the checked distribution to PyPI (requires configured trusted publisher)
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build python --outdir dist/python
      - run: python -m twine check dist/python/*
      - run: python -m pip install dist/python/*.whl
      - run: python -m unittest discover -s python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/python/*
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: distribution
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
