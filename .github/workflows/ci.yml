name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p femlab-engine -p femlab-geometry -p femlab-engine-wasm --target wasm32-unknown-unknown
      # 100 % on the library crates. Regions stand in for branches: llvm-cov measures branches only on nightly.
      # bridge: src/gpu is covered in the gpu job below; delete this exclusion when the gpu job is made
      # required (target: when it has been green three runs in a row)
      - name: coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov -p femlab-engine -p femlab-geometry --ignore-filename-regex 'src/gpu/' --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100

  # GPU kernels for real on a GPU-less runner: Mesa lavapipe is the Vulkan adapter (ADR 0007).
  # Backends::PRIMARY picks Vulkan on Linux; wgpu reads WGPU_BACKEND only through Backends::from_env, which we do not call.
  gpu:
    name: gpu kernels on lavapipe (allowed to fail until green three runs in a row)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LVP_POISON_MEMORY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - run: vulkaninfo --summary || true
      - run: cargo install cargo-llvm-cov --locked
      # Coverage is measured in debug: release inlining mis-attributes regions and the job then
      # reports 99 % on lines that ran. The 66k-DOF D5 sibling is `#[ignore]`d out of that binary
      # and run on its own in release, where it takes seconds instead of ten minutes.
      - run: cargo llvm-cov -p femlab-engine -p femlab-geometry --features gpu-tests --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100
      - run: cargo test --release -p femlab-engine --features gpu-tests --test gpu_kernels -- --ignored sixty_six --nocapture

  # The engine is a library with two hosts: the same Journal must hash identically natively and in wasm.
  wasm-hash:
    name: native vs wasm Journal hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install the wasm-bindgen CLI matching Cargo.lock
        run: |
          V=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | tail -1 | cut -d'"' -f2)
          cargo install --locked wasm-bindgen-cli --version "$V"
      - run: node tools/build-wasm.mjs
      - run: cargo build -p femlab --release
      - run: ./target/release/femlab schema --out engine.schema.json
      - name: replay every fixture natively and in wasm
        run: |
          mkdir -p hashes/native hashes/wasm
          for j in crates/engine/benches/journals/*.json; do
            case "$j" in *.meta.json) continue;; esac
            n=$(basename "$j" .json)
            ./target/release/femlab run "$j" --hashes --skip-solves > "hashes/native/$n.txt"
            node tools/replay-wasm.mjs "$j" --skip-solves > "hashes/wasm/$n.txt"
          done
      - run: node tools/compare-hashes.mjs hashes/native hashes/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            packages/app/src/generated/wasm
            engine.schema.json

  windows:
    name: windows (allowed to fail until gated)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # TypeScript side: generated types are fresh, the registry type-checks, and vitest holds 100 % on
  # all four metrics. No Rust toolchain: the schema document is committed, and the wasm module the
  # app bundles comes from the `wasm-hash` job's artifact.
  web:
    name: web (codegen, typecheck, tests, app build)
    runs-on: ubuntu-latest
    needs: wasm-hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: wasm
      - run: npm ci
      - run: npm run codegen:check
      - run: npm run typecheck
      - run: npm run test -w packages/registry
      - run: npm run test -w packages/app
      # `postbuild` fails the job if an API key ever reaches dist/; the build prints the gzipped
      # size of every chunk, which is the budget size-limit will gate on later.
      - run: npm run build -w packages/app
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/app/dist

  # The built app in a real Chromium (ADR 0014): the CPU path, the service-worker isolation path
  # without server headers, and WebGPU on SwiftShader.
  smoke:
    name: browser smoke (cpu, sw, gpu)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages/app/dist
      - name: playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        working-directory: packages/app
      - run: xvfb-run -a npx playwright test --project=cpu --project=sw
        working-directory: packages/app
      - name: webgpu on swiftshader
        continue-on-error: true
        run: xvfb-run -a npx playwright test --project=gpu
        working-directory: packages/app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/app/playwright-report
