name: Windows direct-solver acceptance (#266)
on:
  push:
    branches: [codex/266-windows-direct-solve]
    paths:
      - crates/engine/src/solve/direct.rs
      - crates/engine/tests/fem.rs
      - crates/femlab/examples/verify_direct_266.rs
      - crates/engine/Cargo.toml
      - Cargo.lock
      - .github/workflows/verify-direct-266.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-direct-266
      - name: Record CPU identity
        run: Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
      - name: Build the corrected CLI
        run: cargo build --locked -p femlab --bin femlab --example verify_direct_266
      - name: Verify reusable factors and unchanged global parallelism
        run: cargo test --locked -p femlab-engine --test fem direct_
      - name: Original Hex8, Hex20, Tet10 and exact CSR at default, one and four threads
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import lzma
          from pathlib import Path
          import subprocess
          import sys
          compressed = Path('tools/replay-le10-266/fixtures/le10-hex20.csr.xz').read_bytes()
          assert hashlib.sha256(compressed).hexdigest() == '5a836ad5efb74bfc5089775a5e4fcd928543784b2616713ac9467232c5d1227b'
          raw = lzma.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == '676daedcc4c2be0c6f5c9b5519e2c9bc619eaa8ae78f5b2baf1282982d198cad'
          matrix = Path('target/le10-266.csr')
          matrix.write_bytes(raw)
          print(f'exact_matrix_sha256={hashlib.sha256(raw).hexdigest()} bytes={len(raw)}', flush=True)
          statuses = []
          for threads in [None, 1, 4]:
              command = [sys.executable, 'tools/diagnose-direct-solve.py', '--binary', 'target/debug/femlab.exe', '--solver', 'cpu-direct', '--include-tet']
              if threads is not None:
                  command += ['--threads', str(threads)]
              try:
                  status = subprocess.run(command, timeout=1200, check=False).returncode
              except subprocess.TimeoutExpired:
                  status = 124
              statuses.append(status)
              print(f'Windows corrected direct threads={threads or "default"}: exit_code={status}', flush=True)
          for threads in [None, 1, 4]:
              command = ['target/debug/examples/verify_direct_266.exe', str(matrix)]
              if threads is not None:
                  command.append(str(threads))
              try:
                  status = subprocess.run(command, timeout=1200, check=False).returncode
              except subprocess.TimeoutExpired:
                  status = 124
              statuses.append(status)
              print(f'Windows corrected exact CSR threads={threads or "default"}: exit_code={status}', flush=True)
          raise SystemExit(1 if any(statuses) else 0)
          PY
