name: deep report
on:
  workflow_run:
    workflows: [ci, gpu]
    types: [completed]

# The scheduled deep run has no PR to turn red, so every failed job becomes a GitHub issue that an
# agent can pick up (issue #820, ADR 0046). One issue per job, ever: a repeat failure comments on
# that issue, reopening it if it was closed, instead of filing a duplicate.
permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.name, .html_url, ([.steps[]? | select(.conclusion == "failure") | .name] | join(", "))] | @tsv' |
          while IFS=$'\t' read -r job url steps; do
            title="Scheduled deep CI: $WORKFLOW / $job failed"
            body=$(printf 'The scheduled deep run failed in **%s**.\n\n- Job: %s\n- Failed step(s): %s\n- Run: %s\n- Commit: %s\n\nReproduce from the job log, fix the cause on a branch and close this issue from the PR. Do not skip, quarantine or loosen the check. See ADR 0046.\n' "$job" "$url" "${steps:-unknown}" "$RUN_URL" "$SHA")
            # Never file the same failure twice: an open issue gets a comment, a closed one is
            # reopened (the fix regressed), and only a title never seen before creates an issue.
            match=$(gh issue list --state all --limit 100 --search "\"$title\" in:title" --json number,title,state \
              --jq "[.[] | select(.title == \"$title\")] | sort_by(.state != \"OPEN\") | .[0] | select(.) | \"\(.number) \(.state)\"")
            number=${match%% *}
            if [ -z "$match" ]; then
              gh issue create --title "$title" --label bug --label ci --body "$body"
            else
              if [ "${match#* }" != "OPEN" ]; then gh issue reopen "$number"; fi
              gh issue comment "$number" --body "$(printf 'Failed again in a scheduled run.\n\n%s' "$body")"
            fi
          done
