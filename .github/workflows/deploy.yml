name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# The app is a static site: it needs no server, so GitHub Pages is the whole deployment.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install the wasm-bindgen CLI matching Cargo.lock
        run: |
          V=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | tail -1 | cut -d'"' -f2)
          cargo install --locked wasm-bindgen-cli --version "$V"
      # `npm ci` first: `build-wasm.mjs` runs the binaryen `wasm-opt` from node_modules, and
      # without it the published module is a third larger.
      - run: npm ci
      - run: node tools/build-wasm.mjs
      # Build once for Chromium to replay every real example through the viewer, then package
      # those fixed 320×180 canvases in the final deploy artifact.
      - run: npm run build -w packages/app
      - name: playwright version for thumbnails
        id: thumbnail-pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.thumbnail-pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        working-directory: packages/app
      # Never let a picture stop the site from shipping. `copy-examples.mjs` already writes
      # `thumbnail: null` for anything missing and the gallery renders a "preview pending" card,
      # so a failed or slow software-rendered pass costs a thumbnail, not a deployment.
      - run: npm run thumbnails -w packages/app
        continue-on-error: true
      # `prebuild` now sees the generated PNGs; `postbuild` still refuses to publish a key.
      - run: npm run build -w packages/app
      # Jekyll would drop the underscore-prefixed files GitHub Pages otherwise serves fine.
      - run: touch packages/app/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
