name: deploy
on:
  # Publish the `dist` that main's CI built, tested and smoke-tested, once that run is green.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # Redeploy the newest green main build without waiting for a merge.
  workflow_dispatch:

# The app is a static site: it needs no server, so GitHub Pages is the whole deployment. It no
# longer builds anything itself (issue #820): the bundle CI tested is the bundle that ships.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      # Jekyll would drop the underscore-prefixed files GitHub Pages otherwise serves fine.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
