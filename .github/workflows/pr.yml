name: pr
on:
  pull_request:

# The pull-request gate (issue #820, ADR 0047): Linux only, about two minutes when Rust is
# untouched. It proves the change type-checks, its unit tests pass and the app still builds within
# its bundle budget. Rust tests run only when Rust changed. Browser smoke, Linux CLI replays, the
# native-vs-wasm hashes and coverage run on merge (`ci.yml`); macOS, Windows and the GPU matrix run
# on the 1st and 15th of each month. Branch protection requires the single `pr gate` check, so jobs can move between tiers
# without touching repository settings.

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      fv52: ${{ steps.filter.outputs.fv52 }}
    steps:
      # Lists the PR's files through the API; no checkout.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/pr.yml'
              - 'tools/verify-fv52-deck.py'
              - 'tools/investigate-fv52.py'
              - '.github/workflows/ci.yml'
            fv52:
              - 'crates/femlab/benches/cases/fv52-published-hex20-deck.json'
              - 'crates/engine/tests/registry/modal_fv52.rs'
              - 'crates/engine/tests/registry.rs'
              - 'tools/verify-fv52-deck.py'
              - 'tools/investigate-fv52.py'
              - '.github/workflows/pr.yml'
              - '.github/workflows/ci.yml'
              - 'crates/engine/src/procedure/modal.rs'
              - 'crates/engine/src/fem/assembly.rs'
              - 'crates/engine/src/fem/element.rs'
              - 'crates/engine/src/fem/material.rs'
              - 'crates/engine/src/fem/problem.rs'
              - 'crates/engine/src/fem/mpc.rs'
              - 'crates/engine/src/fem/quadrature.rs'
              - 'crates/engine/src/fem/shape.rs'
              - 'crates/engine/src/solve/**'
              - 'crates/engine/src/mesh.rs'
              - 'crates/geometry/src/**'
              - 'crates/engine/Cargo.toml'
              - 'crates/geometry/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'vendor/**'

  rust-lint:
    name: rust lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p femlab-engine -p femlab-geometry -p femlab-engine-wasm --target wasm32-unknown-unknown

  # The CLI crate's tests replay and solve every bundled example through the binary (~90 s on
  # their own); they run on merge with the rest of the workspace.
  rust-test:
    name: rust tests
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      # Temporary #850 bootstrap: authoritative metadata before any WASM bundle is built.
      - name: emit authoritative native schema
        env:
          THERMAL850_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cargo run --locked -p femlab -- schema --out engine.schema.json
          python3 - <<'PY850'
          import hashlib,json,os,pathlib,subprocess
          files=subprocess.check_output(['git','ls-files','crates','vendor','Cargo.toml','Cargo.lock','rust-toolchain.toml','.github/workflows/gpu.yml'],text=True).splitlines()
          proof={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'pullRequestHead':os.environ['THERMAL850_PR_HEAD'],
            'schemaSha256':hashlib.sha256(pathlib.Path('engine.schema.json').read_bytes()).hexdigest(),
            'inputs':{f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() for f in sorted(files)}}
          pathlib.Path('native850-source.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY850
      - uses: actions/upload-artifact@v4
        with:
          name: native850-schema
          path: |
            engine.schema.json
            native850-source.json
          if-no-files-found: error
          retention-days: 7
      - name: verify independent thermal invariant controls
        run: |
          set -o pipefail
          cargo test -p femlab-engine --test fem every_linear_procedure_superposes_its_loads -- --exact --nocapture 2>&1 | tee native850-invariants.log
          cargo test -p femlab-engine --test fem a_rotated_heat_model_gives_the_same_temperatures -- --exact --nocapture 2>&1 | tee -a native850-invariants.log
          cargo test -p femlab-engine --test fem thermal_vector_covariance_and_temperature_datum_follow_the_affine_closed_form -- --exact --nocapture 2>&1 | tee -a native850-invariants.log
          python3 -c "from pathlib import Path; assert Path('native850-invariants.log').read_text().count('test result: ok. 1 passed; 0 failed; 0 ignored;') == 3"
      - run: |
          set -o pipefail
          cargo test --workspace --exclude femlab 2>&1 | tee native850-tests.log
      # This multi-minute physics study belongs to main; relevant operator/oracle PRs
      # also run it explicitly. The cheap fixed-deck/rigid replay test always runs above.
      - if: needs.changes.outputs.fv52 == 'true'
        run: |
          set -o pipefail
          cargo test -p femlab-engine --test registry modal_fv52::fv52_enlarged_spectra_obey_square_symmetry_and_nested_space_min_max -- --ignored --exact --nocapture | tee fv52-study.log
          python3 -c "from pathlib import Path; assert 'test result: ok. 1 passed; 0 failed; 0 ignored;' in Path('fv52-study.log').read_text()"
      # D3's independently published fixed deck also has to pass actual CLI dispatch.
      # One 16-element case, not the broad CLI replay suite; unrelated PRs skip it.
      - if: needs.changes.outputs.fv52 == 'true'
        run: |
          cargo run -p femlab -- bench --filter fv52-published-hex20-deck --cpu --threads 1 --json > fv52-benchmark.json
          cat fv52-benchmark.json
          python3 -c "import json; r=json.load(open('fv52-benchmark.json')); assert len(r)==1 and r[0]['name']=='fv52-published-hex20-deck' and r[0]['pass'] and len(r[0]['checks'])==13 and all(c['pass'] for c in r[0]['checks'])"
      - if: always() && needs.changes.outputs.fv52 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fv52-benchmark
          retention-days: 3
          if-no-files-found: error
          path: |
            fv52-benchmark.json
            fv52-study.log

      # Temporary #850 proof uses the unchanged canonical 100% lavapipe thresholds.
      - name: strict GPU coverage on software Vulkan
        id: thermal850_coverage
        run: |
          set -o pipefail
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          THERMAL850_ICD=$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)
          test -n "$THERMAL850_ICD"
          export VK_ICD_FILENAMES="$THERMAL850_ICD"
          export LVP_POISON_MEMORY=true
          vulkaninfo --summary || true
          CARGO_PROFILE_TEST_OPT_LEVEL=0 cargo llvm-cov -p femlab-engine -p femlab-geometry --features gpu-tests --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100 2>&1 | tee gpu850-coverage.log
      - name: export strict GPU coverage detail
        if: always() && (steps.thermal850_coverage.outcome == 'success' || steps.thermal850_coverage.outcome == 'failure')
        run: CARGO_PROFILE_TEST_OPT_LEVEL=0 cargo llvm-cov report -p femlab-engine -p femlab-geometry --json --output-path gpu850-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native850-validation
          path: |
            native850-source.json
            native850-tests.log
            native850-invariants.log
            gpu850-coverage.log
            gpu850-coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: intentionally block bootstrap merge
        if: always()
        run: |
          echo 'The #850 schema/coverage bootstrap is intentionally non-mergeable. Restore canonical pr.yml and generate all references before the final normal gate.'
          exit 1

  # A cache hit (any PR that does not touch Rust) takes seconds; a miss builds the same optimized
  # bundle main builds.
  wasm:
    if: ${{ false }} # Temporary #850 bootstrap; no stale-schema WASM/web build.
    name: wasm bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          retention-days: 3
          path: |
            packages/app/src/generated/wasm
            packages/app/src/generated/wasm-threads
            tools/wasm-node
            tools/project-io

  # Four parallel slices of what `web` runs on main, each about a minute of work.
  web:
    if: ${{ false }} # Temporary #850 bootstrap; no stale-schema WASM/web build.
    name: web (${{ matrix.slice }})
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: checks
            run: |
              python3 -m unittest discover -s infra/stripe -p 'test_*.py'
              python3 -m unittest discover -s tools -p 'test_release_artifacts.py'
              python3 -B -m unittest discover -s tools/abaqus-interoperability -p 'test_*.py'
              python3 -m unittest discover -s infra/google -p 'test_*.py'
              npm run codegen:check
              node --test tools/test-step-assets.mjs
              node --test tools/test-size-runtime.mjs
              node --test tools/test-static-serve.mjs
              npm run typecheck
          - slice: packages
            db: postgres:17
            run: |
              npm run test -w packages/registry
              npm run test -w packages/ai
              npm run test -w packages/evals
              npm run test -w packages/service
              npm run build -w packages/service
              node tools/test-service-build.mjs
              npm run test -w packages/mcp
              npm run build -w packages/mcp
          - slice: app tests
            run: npm run test -w packages/app
          - slice: app build
            run: |
              npm run build -w packages/app
              node tools/test-built-linkage.mjs
              npm run size
    # An empty image skips the service: only the service package's tests need Postgres.
    services:
      postgres:
        image: ${{ matrix.db || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: femlab_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/femlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: wasm
      - run: chmod +x tools/project-io/*/femlab-project-io
      - run: npm ci
      - run: ${{ matrix.run }}

  # The one required check. Skipped Rust jobs (no Rust change) pass; failed or cancelled ones fail.
  gate:
    name: pr gate
    if: always()
    needs: [changes, rust-lint, rust-test, wasm, web]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "pull-request gate passed"
