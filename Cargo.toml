[workspace]
resolver = "2"
members = ["crates/geometry", "crates/engine", "crates/engine-wasm", "crates/femlab"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.94"
repository = "https://github.com/andeplane/fem-lab"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default float parser is not correctly rounded, so a value that
# needs all seventeen significant digits comes back one ulp away and a Journal would not replay
# to the same Model. Determinism is a hard requirement here (ADR 0013), so pay the parse cost.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
schemars = "1.2"
libm = "0.2"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"

# The CLI test replays and solves every bundled example. Level 1 keeps test-profile debug
# assertions while avoiding minutes of unoptimized sparse assembly and factorization.
[profile.test]
opt-level = 1

# Only `tools/build-wasm.mjs` uses this profile, so tuning it for size cannot touch the numbers
# `cargo test` checks: the native `release` profile above is unchanged.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
