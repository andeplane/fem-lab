    args: ['build', '-f', 'infra/google/service.Dockerfile', '-t', 'europe-west3-docker.pkg.dev/$PROJECT_ID/femlab/service:$_REVISION', '.']
images: ['europe-west3-docker.pkg.dev/$PROJECT_ID/femlab/service:$_REVISION']
substitutions:
  _REVISION: dev
options:
  logging: CLOUD_LOGGING_ONLY
