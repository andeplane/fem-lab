[package]
name = "femlab-engine"
description = "FEM Lab: headless finite-element engine (model, commands, journal, solvers)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# test-only: enables the tests that need a GPU adapter; the library never reads it
gpu-tests = []

[dependencies]
femlab-geometry = { path = "../geometry" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
libm.workspace = true
thiserror.workspace = true
sha2 = "0.11"
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"

[dev-dependencies]
proptest = "1.11"
